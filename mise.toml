[env]
LOG_LEVEL = "debug"

[tools]
"aqua:nodejs/node" = "24.11.1"
go = "1.23.4"

[tasks.build]
run = "go build -o renovate-config ./cmd/renovate-config"

[tasks.test]
run = "go test ./..."

[tasks."test:renovate"]
run = "npx -y renovate '--platform=local' '--repository-cache=reset'"

[tasks.ci]
depends = ["test", "build"]
