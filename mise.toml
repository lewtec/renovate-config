[env]
LOG_LEVEL = "debug"

[tools]
"aqua:nodejs/node" = "24.11.1"
uv = "0.9.11"

[tasks.install]
run = "uv sync --all-extras"

[tasks.test]
depends = ["install"]
run = "uv run pytest"
env = { PYTHONPATH = "src" }

[tasks."test:renovate"]
run = "npx -y renovate '--platform=local' '--repository-cache=reset'"

[tasks.ci]
depends = ["test"]
